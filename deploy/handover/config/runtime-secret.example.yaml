# Reference for your secret controller. Supply values through your approved secret store.
apiVersion: v1
kind: Secret
metadata:
  name: aspm-runtime
type: Opaque
stringData:
  django-secret-key: "<generated-high-entropy-string>"
  credential-aes-key: "<64-hex-characters>"
  database-url: "<postgresql-uri-with-percent-encoded-credentials>"
  broker-url: "<rediss-uri-from-broker-owner>"
  cache-url: "<rediss-uri-from-cache-owner>"
