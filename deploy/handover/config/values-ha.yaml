# Requires private external dependencies, CSI RWX claims and a TLS ingress.
web:
  replicas: 2
  gracefulDrain: true
  resources:
    requests: {cpu: 600m, memory: 1Gi}
    limits: {cpu: 1750m, memory: 2Gi}
  nginxResources:
    requests: {cpu: 100m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}
worker:
  replicas: 3
  concurrency: 2
  readinessProbeEnabled: true
  resources:
    requests: {cpu: 600m, memory: 1Gi}
    limits: {cpu: "2", memory: 2Gi}
  pdb:
    enabled: true
    minAvailable: 2
migrations:
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "1", memory: 2Gi}
scheduling:
  enabled: true
  nodePolicy: DoNotSchedule
  preferDistinctNodes: true
  zonePolicy: ScheduleAnyway
ingress:
  enabled: true
pdb:
  enabled: true
  minAvailable: 1
tests:
  enabled: true
