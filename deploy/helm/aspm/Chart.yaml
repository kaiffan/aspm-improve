apiVersion: v2
name: aspm
description: ASPM API ingestion, private evidence and durable integrations
version: 0.1.0-rc.11
appVersion: "1.0.1-enterprise-rc"
type: application
kubeVersion: ">=1.27.0-0"
annotations:
  artifacthub.io/prerelease: "true"
  artifacthub.io/changes: |
    - kind: added
      description: ASPM workloads with external dependencies, schema fencing and private shared storage
    - kind: fixed
      description: Include the opt-in HTTP test Pod in the packaged chart
    - kind: fixed
      description: Render the free storage threshold as a decimal integer for the Django runtime
    - kind: fixed
      description: Wait for nginx readiness and report bounded ClusterIP HTTP smoke retries
    - kind: added
      description: Add local, standard HA and high-throughput profiles with worker disruption and optional autoscaling policies
    - kind: changed
      description: Verify nginx static readiness and provide configurable ingress drain for web shutdown
    - kind: added
      description: Support namespace-scoped ingress controllers and selector-based ingress policy
    - kind: added
      description: Add component-scoped preferred anti-affinity and complete the corporate HA example
    - kind: fixed
      description: Apply release placement rules to migration and test hooks
    - kind: added
      description: Add private ASPM metrics, Prometheus collection and scoped VictoriaMetrics remote write
    - kind: added
      description: Add private S3 storage for immutable scan artifacts, generated reports and Classic media
