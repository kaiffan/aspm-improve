apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aspm.fullname" . }}-nginx
  labels:
    {{- include "aspm.labels" . | nindent 4 }}
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 1024; }
    http {
      include /etc/nginx/mime.types;
      access_log /dev/stdout;
      client_body_temp_path /tmp/client-body;
      proxy_temp_path /tmp/proxy;
      uwsgi_temp_path /tmp/uwsgi;
      client_max_body_size 51m;
      server {
        listen 8080;
        server_tokens off;
        location /static/ { alias /usr/share/nginx/html/static/; }
        location /health/ { return 404; }
        location /django_metrics { return 404; }
        location / {
          include /etc/nginx/wsgi_params;
          uwsgi_pass 127.0.0.1:3031;
          uwsgi_read_timeout 120s;
          uwsgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        }
      }
    }
