{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aspm.fullname" . }}
  labels: {{ include "aspm.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{ include "aspm.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace | quote }}
          {{- with .Values.networkPolicy.ingressPodSelector }}
          podSelector: {{ toYaml . | nindent 12 }}
          {{- end }}
      ports: [{protocol: TCP, port: 8080}]
    {{- if .Values.monitoring.serviceMonitor.enabled }}
    - from:
        - namespaceSelector: {{ toYaml .Values.monitoring.serviceMonitor.namespaceSelector | nindent 12 }}
          podSelector: {{ toYaml .Values.monitoring.serviceMonitor.podSelector | nindent 12 }}
      ports: [{protocol: TCP, port: 8081}]
    {{- end }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "aspm.selector" . | nindent 14 }}
              app.kubernetes.io/component: test
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}

{{- if and .Values.tests.enabled .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aspm.fullname" . }}-test
spec:
  podSelector:
    matchLabels:
      {{- include "aspm.selector" . | nindent 6 }}
      app.kubernetes.io/component: test
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "aspm.selector" . | nindent 14 }}
              app.kubernetes.io/component: web
      ports: [{protocol: TCP, port: 8080}]
{{- end }}
