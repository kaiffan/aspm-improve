{{- if and .Values.monitoring.enabled .Values.monitoring.dedicated.enabled }}
{{- $m := .Values.monitoring }}
{{- $p := $m.dedicated }}
{{- $r := $m.remoteWrite }}
{{- $name := printf "%s-prom" (include "aspm.fullname" .) }}
{{- if and $r.url (not (hasPrefix "https://" $r.url)) }}
{{- fail "Use HTTPS for monitoring.remoteWrite.url" }}
{{- end }}
{{- if and $r.url (regexMatch "https://[^/]*@" $r.url) }}
{{- fail "Use a Secret reference for remote write credentials" }}
{{- end }}
{{- if and $r.url (ne $r.authType "none") (not $r.authSecret) }}
{{- fail "monitoring.remoteWrite.authSecret is required for basic or bearer authentication" }}
{{- end }}
{{- if and $r.url (or $r.customCA $r.mutualTLS) (not $r.tlsSecret) }}
{{- fail "monitoring.remoteWrite.tlsSecret is required for CA or mTLS" }}
{{- end }}
{{- if and $r.url (or (lt (int $r.minShards) 1) (lt (int $r.maxShards) (int $r.minShards)) (lt (int $r.maxSamplesPerSend) 1) (lt (int $r.capacity) (int $r.maxSamplesPerSend))) }}
{{- fail "Invalid Prometheus remote write queue dimensions" }}
{{- end }}
{{- if not (and (hasKey $p.externalLabels "cluster") (hasKey $p.externalLabels "environment") (get $p.externalLabels "cluster") (get $p.externalLabels "environment")) }}
{{- fail "Set monitoring.dedicated.externalLabels.cluster and .environment" }}
{{- end }}
{{- range $key := list "namespace" "release" "component" "application" "instance" "pod" "job" }}
{{- if hasKey $p.externalLabels $key }}
{{- fail (printf "Dedicated collector label %s is reserved for target identity" $key) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
subjects:
  - {kind: ServiceAccount, name: {{ $name }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $name }}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ $m.interval | quote }}
      scrape_timeout: {{ $m.timeout | quote }}
      external_labels: {{ toYaml $p.externalLabels | nindent 8 }}
    {{- if $m.rules.enabled }}
    rule_files: [/etc/aspm-rules/rules.yaml]
    {{- end }}
    {{- with $p.alertmanagers }}
    alerting:
      alertmanagers: {{ toYaml . | nindent 8 }}
    {{- end }}
    scrape_configs:
      - job_name: aspm
        metrics_path: {{ $m.path | quote }}
        kubernetes_sd_configs:
          - role: pod
            namespaces: {names: [{{ .Release.Namespace | quote }}]}
        {{- if $m.scrapeAuthSecret }}
        authorization: {credentials_file: /etc/aspm-scrape-auth/token}
        {{- end }}
        {{- if $m.scrapeTLSSecret }}
        scheme: https
        tls_config:
          ca_file: /etc/aspm-scrape-ca/ca.crt
          {{- if $m.scrapeServerName }}
          server_name: {{ $m.scrapeServerName | quote }}
          {{- end }}
        {{- end }}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_label_app_kubernetes_io_instance, __meta_kubernetes_pod_container_port_name, __meta_kubernetes_pod_phase]
            regex: {{ printf "%s;%s;aspm-metrics;Running" (include "aspm.name" .) .Release.Name | quote }}
            action: keep
          {{- range include "aspm.monitoring.relabel" . | fromYamlArray }}
          - {{ toYaml (dict "action" (default "replace" .action) "source_labels" (default (list) .sourceLabels) "target_label" (default "" .targetLabel) "regex" (default "(.*)" .regex) "replacement" (default "$1" .replacement)) | nindent 12 | trim }}
          {{- end }}
      - job_name: aspm-prometheus
        static_configs:
          - targets: ["localhost:9090"]
            labels:
              application: aspm
              component: prometheus
              namespace: {{ .Release.Namespace | quote }}
              release: {{ .Release.Name | quote }}
              {{- toYaml $p.externalLabels | nindent 14 }}
      {{- range $id, $exporter := $m.exporters }}
      {{- if $exporter.enabled }}
      - job_name: aspm-{{ $id }}
        scrape_interval: 60s
        static_configs:
          - targets: [{{ printf "%s-%s:%v" (include "aspm.fullname" $ | trunc 50 | trimSuffix "-") $id (ternary 9187 9121 (eq $id "postgresql")) | quote }}]
            labels:
              application: aspm
              component: {{ $id }}
              namespace: {{ $.Release.Namespace | quote }}
              release: {{ $.Release.Name | quote }}
              {{- toYaml $p.externalLabels | nindent 14 }}
      {{- end }}
      {{- end }}
      {{- with $p.extraScrapeConfigs }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
    {{- if $r.url }}
    remote_write:
      - name: aspm-victoriametrics
        url: {{ $r.url | quote }}
        remote_timeout: {{ $r.timeout | quote }}
        protobuf_message: prometheus.WriteRequest
        {{- if eq $r.authType "basic" }}
        basic_auth:
          username_file: /etc/aspm-write-auth/username
          password_file: /etc/aspm-write-auth/password
        {{- else if eq $r.authType "bearer" }}
        authorization: {credentials_file: /etc/aspm-write-auth/token}
        {{- end }}
        {{- if $r.tlsSecret }}
        tls_config:
          {{- if $r.customCA }}
          ca_file: /etc/aspm-write-tls/ca.crt
          {{- end }}
          {{- if $r.mutualTLS }}
          cert_file: /etc/aspm-write-tls/tls.crt
          key_file: /etc/aspm-write-tls/tls.key
          {{- end }}
        {{- end }}
        queue_config:
          min_shards: {{ $r.minShards }}
          max_shards: {{ $r.maxShards }}
          capacity: {{ $r.capacity }}
          max_samples_per_send: {{ $r.maxSamplesPerSend }}
          retry_on_http_429: true
        write_relabel_configs:
          - source_labels: [application, namespace, release]
            regex: {{ printf "aspm;%s;%s" .Release.Namespace .Release.Name | quote }}
            action: keep
          - source_labels: [__name__]
            regex: '(pg_stat_statements_.*|kube_.*_(labels|annotations))'
            action: drop
          - source_labels: [__name__]
            regex: {{ include "aspm.monitoring.allowlist" . | quote }}
            action: keep
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/component: prometheus, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: http, port: 9090}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/component: prometheus, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/component: prometheus, app.kubernetes.io/instance: {{ .Release.Name }}}
      annotations:
        checksum/monitoring: {{ toJson $m | sha256sum }}
        checksum/rules: {{ .Files.Get "observability/rules.yaml" | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: prometheus
          image: {{ $p.image | quote }}
          args:
            - --config.file=/etc/aspm-prom/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ $p.retention }}
            - --storage.tsdb.retention.size={{ $p.retentionSize }}
          ports: [{name: http, containerPort: 9090}]
          readinessProbe: {httpGet: {path: /-/ready, port: http}}
          livenessProbe: {httpGet: {path: /-/healthy, port: http}}
          securityContext: {{ toYaml .Values.securityContext | nindent 12 }}
          resources: {{ toYaml $p.resources | nindent 12 }}
          volumeMounts:
            - {name: conf, mountPath: /etc/aspm-prom, readOnly: true}
            - {name: data, mountPath: /prometheus}
            {{- if $m.rules.enabled }}
            - {name: rules, mountPath: /etc/aspm-rules, readOnly: true}
            {{- end }}
            {{- if $m.scrapeAuthSecret }}
            - {name: scrape-auth, mountPath: /etc/aspm-scrape-auth, readOnly: true}
            {{- end }}
            {{- if $m.scrapeTLSSecret }}
            - {name: scrape-ca, mountPath: /etc/aspm-scrape-ca, readOnly: true}
            {{- end }}
            {{- if and $r.url $r.authSecret }}
            - {name: write-auth, mountPath: /etc/aspm-write-auth, readOnly: true}
            {{- end }}
            {{- if and $r.url $r.tlsSecret }}
            - {name: write-tls, mountPath: /etc/aspm-write-tls, readOnly: true}
            {{- end }}
      volumes:
        - {name: conf, configMap: {name: {{ $name }}}}
        {{- if $m.rules.enabled }}
        - {name: rules, configMap: {name: {{ $name }}-rules}}
        {{- end }}
        {{- if $m.scrapeAuthSecret }}
        - {name: scrape-auth, secret: {secretName: {{ $m.scrapeAuthSecret | quote }}}}
        {{- end }}
        {{- if $m.scrapeTLSSecret }}
        - {name: scrape-ca, secret: {secretName: {{ required "monitoring.scrapeCASecret is required for TLS" $m.scrapeCASecret | quote }}}}
        {{- end }}
        {{- if and $r.url $r.authSecret }}
        - {name: write-auth, secret: {secretName: {{ $r.authSecret | quote }}}}
        {{- end }}
        {{- if and $r.url $r.tlsSecret }}
        - {name: write-tls, secret: {secretName: {{ $r.tlsSecret | quote }}}}
        {{- end }}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with $p.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources: {requests: {storage: {{ $p.storageSize | quote }}}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: prometheus, app.kubernetes.io/instance: {{ .Release.Name }}}
  policyTypes: [Ingress]
  ingress: []
{{- end }}
