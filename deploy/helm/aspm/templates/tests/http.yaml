{{- if and .Values.tests.enabled .Values.web.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "aspm.fullname" . }}-http-test
  labels:
    {{- include "aspm.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  activeDeadlineSeconds: 60
  securityContext: {{ toYaml .Values.podSecurityContext | nindent 4 }}
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets: {{ toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: http
      image: {{ include "aspm.image" .Values.image | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command: [python, -c]
      args:
        - |
          import time
          import urllib.error
          import urllib.request

          endpoint = "http://{{ include "aspm.fullname" . }}:{{ .Values.service.port }}/login"
          request = urllib.request.Request(endpoint, headers={"Host": "localhost"})
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          for attempt in range(1, 9):
              try:
                  with opener.open(request, timeout=4) as response:
                      if response.status != 200 or b"csrfmiddlewaretoken" not in response.read(1048576):
                          raise SystemExit(f"ASPM login smoke got an unexpected response from {endpoint}")
                  print(f"ASPM login smoke passed: HTTP 200 from {endpoint} (attempt {attempt})")
                  break
              except urllib.error.HTTPError as error:
                  raise SystemExit(f"ASPM login smoke got HTTP {error.code} from {endpoint}") from error
              except (urllib.error.URLError, TimeoutError) as error:
                  print(f"ASPM login smoke attempt {attempt}: {endpoint}: {error}", flush=True)
                  if attempt == 8:
                      raise SystemExit("ASPM login Service is unreachable") from error
                  time.sleep(2)
      securityContext: {{ toYaml .Values.securityContext | nindent 8 }}
      resources:
        requests: {cpu: 50m, memory: 128Mi}
        limits: {cpu: 500m, memory: 256Mi}
{{- end }}
