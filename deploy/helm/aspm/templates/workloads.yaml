{{- $root := . }}
{{- range $component := list "web" "worker" "beat" }}
{{- $cfg := index $root.Values $component }}
{{- if $cfg.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aspm.fullname" $root }}-{{ $component }}
  labels:
    {{- include "aspm.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  {{- if eq $component "beat" }}
  replicas: 1
  strategy: {type: Recreate}
  {{- else }}
  {{- if not (or (and (eq $component "web") $root.Values.hpa.enabled) (and (eq $component "worker") $root.Values.worker.hpa.enabled)) }}
  replicas: {{ $cfg.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  {{- end }}
  selector:
    matchLabels:
      {{- include "aspm.selector" $root | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        {{- with $root.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- include "aspm.selector" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
      annotations:
        checksum/config: {{ toJson $root.Values.config | sha256sum }}
        {{- if eq $component "web" }}
        checksum/nginx: {{ include (print $root.Template.BasePath "/configmap.yaml") $root | fromYaml | dig "data" "nginx.conf" "" | sha256sum }}
        {{- end }}
        {{- with $root.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "aspm.serviceAccount" $root }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ $cfg.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml $root.Values.podSecurityContext | nindent 8 }}
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- $scheduling := $root.Values.scheduling }}
      {{- $affinity := deepCopy $root.Values.affinity }}
      {{- if and $scheduling.enabled $scheduling.preferDistinctNodes (ne $component "beat") }}
      {{- $antiAffinity := default (dict) $affinity.podAntiAffinity }}
      {{- $selector := include "aspm.selector" $root | fromYaml }}
      {{- $_ := set $selector "app.kubernetes.io/component" $component }}
      {{- $term := dict "weight" 100 "podAffinityTerm" (dict "topologyKey" "kubernetes.io/hostname" "labelSelector" (dict "matchLabels" $selector)) }}
      {{- $preferred := default (list) $antiAffinity.preferredDuringSchedulingIgnoredDuringExecution }}
      {{- $_ := set $antiAffinity "preferredDuringSchedulingIgnoredDuringExecution" (append $preferred $term) }}
      {{- $_ := set $affinity "podAntiAffinity" $antiAffinity }}
      {{- end }}
      {{- with $affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- if or $root.Values.topologySpreadConstraints (and $scheduling.enabled (ne $component "beat")) }}
      topologySpreadConstraints:
        {{- with $root.Values.topologySpreadConstraints }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if and $scheduling.enabled (ne $component "beat") }}
        {{- range $topology, $policy := dict "kubernetes.io/hostname" $scheduling.nodePolicy "topology.kubernetes.io/zone" $scheduling.zonePolicy }}
        {{- if $policy }}
        - maxSkew: 1
          topologyKey: {{ $topology }}
          whenUnsatisfiable: {{ $policy }}
          labelSelector:
            matchLabels:
              {{- include "aspm.selector" $root | nindent 14 }}
              app.kubernetes.io/component: {{ $component }}
        {{- end }}
        {{- end }}
        {{- end }}
      {{- end }}
      initContainers:
        - name: schema-and-storage
          image: {{ include "aspm.image" $root.Values.image | quote }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          command: [python, manage.py, aspm_preflight, --wait-seconds=300]
          env: {{ include "aspm.env" $root | nindent 12 }}
          securityContext: {{ toYaml $root.Values.securityContext | nindent 12 }}
          resources: {{ toYaml $cfg.resources | nindent 12 }}
          volumeMounts:
            - {name: evidence, mountPath: /app/aspm-private}
            - {name: tmp, mountPath: /tmp}
            {{- if $root.Values.databaseTLS.existingSecret }}
            - {name: db-tls, mountPath: /app/db-tls, readOnly: true}
            {{- end }}
      containers:
        - name: {{ $component }}
          image: {{ include "aspm.image" $root.Values.image | quote }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          {{- if eq $component "web" }}
          command: [uwsgi]
          args: [--master, --need-app, --die-on-term, --enable-threads, --disable-logging, --socket, "127.0.0.1:3031", --http, "0.0.0.0:8081", --http-to, "127.0.0.1:3031", --wsgi, "dojo.wsgi:application", --processes, {{ $cfg.processes | quote }}, --threads, {{ $cfg.threads | quote }}, --buffer-size, "16384", --reload-mercy, "60"]
          ports: [{name: health, containerPort: 8081}]
          startupProbe: {{ toYaml $cfg.startupProbe | nindent 12 }}
          readinessProbe: {{ toYaml $cfg.readinessProbe | nindent 12 }}
          livenessProbe: {{ toYaml $cfg.livenessProbe | nindent 12 }}
          {{- if $cfg.gracefulDrain }}
          {{- if lt (int $cfg.terminationGracePeriodSeconds) 145 }}
          {{- fail "web.gracefulDrain requires terminationGracePeriodSeconds >= 145" }}
          {{- end }}
          lifecycle:
            preStop:
              exec: {command: [sleep, "130"]}
          {{- end }}
          {{- else if eq $component "worker" }}
          command: [celery]
          args: [--app=dojo, worker, --loglevel=INFO, --pool=prefork, {{ printf "--concurrency=%v" $cfg.concurrency | quote }}, --prefetch-multiplier=1, {{ printf "--queues=%s" $cfg.queues | quote }}]
          {{- if $cfg.readinessProbeEnabled }}
          readinessProbe:
            exec:
              command: [sh, -ec, 'celery --app=dojo inspect --timeout=3 --destination="celery@$HOSTNAME" ping']
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 8
            failureThreshold: 3
          {{- end }}
          {{- else }}
          command: [python, manage.py, aspm_beat]
          {{- end }}
          env: {{ include "aspm.env" $root | nindent 12 }}
          {{- if and (eq $component "web") $root.Values.oidc.enabled }}
          {{- include "aspm.oidc.env" $root | nindent 12 }}
          {{- end }}
          securityContext: {{ toYaml $root.Values.securityContext | nindent 12 }}
          resources: {{ toYaml $cfg.resources | nindent 12 }}
          volumeMounts:
            - {name: evidence, mountPath: /app/aspm-private}
            - {name: media, mountPath: /app/media}
            - {name: tmp, mountPath: /tmp}
            - {name: run, mountPath: /var/run/defectdojo}
            {{- if and (eq $component "web") $root.Values.oidc.enabled $root.Values.oidc.existingCaSecret }}
            - {name: oidc-ca, mountPath: /app/idp-tls, readOnly: true}
            {{- end }}
            {{- if $root.Values.databaseTLS.existingSecret }}
            - {name: db-tls, mountPath: /app/db-tls, readOnly: true}
            {{- end }}
        {{- if eq $component "web" }}
        - name: nginx
          image: {{ include "aspm.image" $root.Values.nginxImage | quote }}
          imagePullPolicy: {{ $root.Values.nginxImage.pullPolicy }}
          command: [nginx, -g, "daemon off;"]
          ports: [{name: http, containerPort: 8080}]
          startupProbe:
            httpGet: {path: /static/dojo/css/aspm.css, port: http}
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet: {path: /static/dojo/css/aspm.css, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 15
            timeoutSeconds: 2
          {{- if $cfg.gracefulDrain }}
          lifecycle:
            preStop:
              exec: {command: [sleep, "5"]}
          {{- end }}
          securityContext: {{ toYaml $root.Values.securityContext | nindent 12 }}
          resources: {{ toYaml $cfg.nginxResources | nindent 12 }}
          volumeMounts:
            - {name: nginx-config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
            - {name: nginx-tmp, mountPath: /tmp}
        {{- end }}
      volumes:
        {{- if and (eq $component "web") $root.Values.oidc.enabled $root.Values.oidc.existingCaSecret }}
        - name: oidc-ca
          secret:
            secretName: {{ $root.Values.oidc.existingCaSecret | quote }}
        {{- end }}
        - name: evidence
          persistentVolumeClaim: {claimName: {{ $root.Values.storage.existingClaim | quote }}}
        - name: media
          persistentVolumeClaim: {claimName: {{ $root.Values.storage.mediaExistingClaim | quote }}}
        - {name: tmp, emptyDir: {sizeLimit: 1Gi}}
        - {name: run, emptyDir: {sizeLimit: 64Mi}}
        {{- if $root.Values.databaseTLS.existingSecret }}
        - name: db-tls
          secret: {secretName: {{ $root.Values.databaseTLS.existingSecret | quote }}}
        {{- end }}
        {{- if eq $component "web" }}
        - {name: nginx-tmp, emptyDir: {sizeLimit: 128Mi}}
        - name: nginx-config
          configMap: {name: {{ include "aspm.fullname" $root }}-nginx}
        {{- end }}
{{- end }}
{{- end }}
