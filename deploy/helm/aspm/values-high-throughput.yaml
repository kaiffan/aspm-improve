# Apply with the same infrastructure settings as values-ha.yaml.
web:
  replicas: 2
  gracefulDrain: true
  resources:
    requests: {cpu: 750m, memory: 1Gi}
    limits: {cpu: 1500m, memory: 2Gi}
  nginxResources:
    requests: {cpu: 100m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}
worker:
  replicas: 3
  concurrency: 2
  readinessProbeEnabled: true
  resources:
    requests: {cpu: 750m, memory: 1Gi}
    limits: {cpu: 1500m, memory: 2Gi}
  pdb:
    enabled: true
    minAvailable: 2
  hpa:
    enabled: false
    minReplicas: 3
    maxReplicas: 4
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
migrations:
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "1", memory: 2Gi}
scheduling:
  enabled: true
  nodePolicy: DoNotSchedule
  zonePolicy: ScheduleAnyway
ingress:
  enabled: true
pdb:
  enabled: true
  minAvailable: 1
tests:
  enabled: true
