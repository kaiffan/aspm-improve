nameOverride: ""
fullnameOverride: ""
image:
  repository: aspm/django
  tag: "1.0.1-enterprise-rc"
  digest: ""
  pullPolicy: IfNotPresent
nginxImage:
  repository: aspm/nginx
  tag: "1.0.1-enterprise-rc"
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
# Provision separately. No credentials are generated by Helm.
existingSecret: aspm-runtime
secretKeys:
  secretKey: django-secret-key
  credentialKey: credential-aes-key
  databaseUrl: database-url
  brokerUrl: broker-url
  cacheUrl: cache-url
config:
  DD_ALLOWED_HOSTS: localhost,aspm.example.invalid
  DD_SITE_URL: https://aspm.example.invalid
  DD_DEBUG: "False"
  DD_TRACK_MIGRATIONS: "True"
  DD_ASPM_INGESTION_ENABLED: "True"
  DD_ASPM_DEFAULT_ENGAGEMENT_POLICY: default
  DD_ASPM_API_ONLY: "True"
  DD_ASPM_SCM_HIERARCHY: "True"
  DD_ASPM_WEBHOOKS_ENABLED: "False"
  DD_ASPM_ARTIFACT_ROOT: /app/aspm-private
  DD_DJANGO_METRICS_ENABLED: "True"
  DD_DATABASE_CONN_MAX_AGE: "60"
  DD_DATABASE_OPTIONS: '{"connect_timeout":3,"sslmode":"verify-full","sslrootcert":"/app/db-tls/ca.crt"}'
  DD_SESSION_COOKIE_SECURE: "True"
  DD_CSRF_COOKIE_SECURE: "True"
  DD_SECURE_PROXY_SSL_HEADER: "True"
# Keycloak HTTPS Authorization Code flow. Supply the client credential out of band.
oidc:
  enabled: false
  issuer: ""
  callbackUrl: ""
  clientId: ""
  existingSecret: ""
  clientSecretKey: oidc-client-secret
  clientAuth: client_secret_basic
  scopes: openid
  roleClaim: aspm_roles
  groupClaim: aspm_product_grants
  secopsRole: aspm-secops
  expertRole: aspm-expert
  userRole: aspm-user
  sessionAge: 3600
  groupTtl: 300
  providerLogout: true
  existingCaSecret: ""
# PostgreSQL verify-full CA. Supply a Secret containing ca.crt.
databaseTLS:
  existingSecret: aspm-postgres-ca
storage:
  existingClaim: aspm-evidence
  mediaExistingClaim: aspm-media
  # RWX semantics, same UID and atomic rename/fsync must be qualified on the real CSI driver.
  minimumFreeBytes: 1073741824
serviceAccount:
  create: true
  name: ""
  annotations: {}
podLabels: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
# Component-scoped scheduling rules. Empty values preserve existing scheduling.
scheduling:
  enabled: false
  nodePolicy: ScheduleAnyway
  zonePolicy: ""
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1337
  fsGroup: 1337
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
web:
  enabled: true
  replicas: 2
  processes: 2
  threads: 2
  terminationGracePeriodSeconds: 150
  gracefulDrain: false
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}
  nginxResources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  startupProbe:
    httpGet: {path: /health/startup, port: health, httpHeaders: [{name: Host, value: localhost}]}
    failureThreshold: 60
    periodSeconds: 5
    timeoutSeconds: 5
  readinessProbe:
    httpGet: {path: /health/ready, port: health, httpHeaders: [{name: Host, value: localhost}]}
    failureThreshold: 3
    periodSeconds: 10
    timeoutSeconds: 5
  livenessProbe:
    httpGet: {path: /health/live, port: health, httpHeaders: [{name: Host, value: localhost}]}
    failureThreshold: 3
    periodSeconds: 15
    timeoutSeconds: 3
worker:
  enabled: true
  replicas: 2
  concurrency: 2
  queues: celery
  readinessProbeEnabled: false
  pdb:
    enabled: false
    minAvailable: 2
  hpa:
    enabled: false
    minReplicas: 3
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  # Longer than the ingestion hard task limit of 900 seconds.
  terminationGracePeriodSeconds: 960
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}
beat:
  enabled: true
  terminationGracePeriodSeconds: 60
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
migrations:
  enabled: true
  activeDeadlineSeconds: 1800
  lockWaitSeconds: 120
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}
service:
  port: 80
  annotations: {}
ingress:
  enabled: false
  className: nginx
  annotations: {}
  host: aspm.example.invalid
  tlsSecretName: aspm-tls
networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  ingressPodSelector: {}
  # Allow external PostgreSQL, broker/cache and approved webhook consumers explicitly.
  # Each item is a Kubernetes NetworkPolicy egress rule.
  egress: []
pdb:
  enabled: true
  minAvailable: 1
hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
monitoring:
  serviceMonitor:
    enabled: false
    labels: {}
    namespaceSelector: {}
    podSelector: {}
extraEnv: []
tests:
  enabled: false
