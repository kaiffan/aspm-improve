# Apply last on existing aspm-lab-orbstack release values. The node is single-host.
web:
  replicas: 2
  gracefulDrain: true
worker:
  replicas: 3
  readinessProbeEnabled: true
  pdb:
    enabled: true
    minAvailable: 2
scheduling:
  enabled: true
  nodePolicy: ScheduleAnyway
pdb:
  enabled: true
  minAvailable: 1
tests:
  enabled: true
