{% load i18n %}
<form class="filters aspm-workspace-form" method="get" role="search" aria-label="{{ search_label }}">
    <label for="{{ search_id }}">{{ search_label }}</label>
    <input id="{{ search_id }}" class="form-control" type="search" name="q" value="{{ query }}" maxlength="150">
    <label for="workspace-product-type">{% trans "Product type" %}</label>
    <select class="form-control" name="product_type" id="workspace-product-type">
        <option value="">{% trans "All types" %}</option>
        {% for type in product_types %}<option value="{{ type.pk }}" {% if selected_type == type.pk|stringformat:"s" %}selected{% endif %}>{{ type.name }}</option>{% endfor %}
    </select>
    <button type="submit" class="btn btn-secondary">{% trans "Search" %}</button>
    {% if query or selected_type %}<a href="{{ request.path }}">{% trans "Clear filters" %}</a>{% endif %}
</form>
