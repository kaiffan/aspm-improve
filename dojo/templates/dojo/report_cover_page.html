{% extends "report_base.html" %}
{% load i18n %}
{% load static %}
{% block content %}
    {{ block.super }}
    <div class="container">
        <div class="page-cover-spacer">&nbsp;</div>
        <div class="text-center page-cover">
            <p>
                <img src="{% static report_brand.mark %}" alt="{{ report_brand.name }}" width="64" height="64"/>
                <strong style="display:block; margin-top:12px; font-size:28px;">{{ report_brand.name }}</strong>
            </p>

            <h1>{{ report_title }}</h1>

            <h2>{{ report_subtitle }}</h2>
            <p>
                {{ report_info }}
            </p>
        </div>
    </div>
{% endblock %}
