<nav aria-label="Pagination"><p>Page {{ page.number }} of {{ page.paginator.num_pages }} · {{ page.paginator.count }} records</p>{% if page.has_previous %}<a class="btn btn-default" href="?page={{ page.previous_page_number }}&amp;q={{ query|urlencode }}&amp;state={{ selected_state|urlencode }}">Previous</a>{% endif %} {% if page.has_next %}<a class="btn btn-default" href="?page={{ page.next_page_number }}&amp;q={{ query|urlencode }}&amp;state={{ selected_state|urlencode }}">Next</a>{% endif %}</nav>
