# Source: aspm/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: qualification-aspm-nginx
  labels:
    app.kubernetes.io/name: aspm
    app.kubernetes.io/instance: qualification
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: "aspm-0.1.0-rc.1"
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 1024; }
    http {
      include /etc/nginx/mime.types;
      access_log /dev/stdout;
      client_body_temp_path /tmp/client-body;
      proxy_temp_path /tmp/proxy;
      uwsgi_temp_path /tmp/uwsgi;
      fastcgi_temp_path /tmp/fastcgi;
      scgi_temp_path /tmp/scgi;
      client_max_body_size 51m;
      server {
        listen 8080;
        server_tokens off;
        location /static/ { alias /usr/share/nginx/html/static/; }
        location /health/ { return 404; }
        location /django_metrics { return 404; }
        location / {
          include /etc/nginx/wsgi_params;
          uwsgi_pass 127.0.0.1:3031;
          uwsgi_read_timeout 120s;
          uwsgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        }
      }
    }

