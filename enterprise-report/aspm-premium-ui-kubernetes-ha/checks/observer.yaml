apiVersion: v1
kind: Pod
metadata:
  name: aspm-ha-observer
  namespace: aspm-lab-orbstack
  labels:
    app.kubernetes.io/name: aspm
    app.kubernetes.io/instance: aspm
    app.kubernetes.io/component: test
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  activeDeadlineSeconds: 7200
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: observe
      image: aspm-dual-lab/django:6e88953f3cd8
      imagePullPolicy: Never
      command: [sleep, "7200"]
      resources:
        requests: {cpu: 30m, memory: 64Mi}
        limits: {cpu: "1", memory: 256Mi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
