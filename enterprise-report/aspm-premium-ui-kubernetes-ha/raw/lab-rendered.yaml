# Source: aspm/templates/tests/http.yaml
apiVersion: v1
kind: Pod
metadata:
  name: aspm-aspm-http-test
  labels:
    app.kubernetes.io/name: aspm
    app.kubernetes.io/instance: aspm
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: "aspm-0.1.0-rc.7"
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  activeDeadlineSeconds: 60
  securityContext:
    fsGroup: 1337
    fsGroupChangePolicy: OnRootMismatch
    runAsGroup: 1337
    runAsNonRoot: true
    runAsUser: 1001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: http
      image: "aspm-dual-lab/django:6e88953f3cd8"
      imagePullPolicy: Never
      command: [python, -c]
      args:
        - |
          import time
          import urllib.error
          import urllib.request

          endpoint = "http://aspm-aspm:80/login"
          request = urllib.request.Request(endpoint, headers={"Host": "localhost"})
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          for attempt in range(1, 9):
              try:
                  with opener.open(request, timeout=4) as response:
                      if response.status != 200 or b"csrfmiddlewaretoken" not in response.read(1048576):
                          raise SystemExit(f"ASPM login smoke got an unexpected response from {endpoint}")
                  print(f"ASPM login smoke passed: HTTP 200 from {endpoint} (attempt {attempt})")
                  break
              except urllib.error.HTTPError as error:
                  raise SystemExit(f"ASPM login smoke got HTTP {error.code} from {endpoint}") from error
              except (urllib.error.URLError, TimeoutError) as error:
                  print(f"ASPM login smoke attempt {attempt}: {endpoint}: {error}", flush=True)
                  if attempt == 8:
                      raise SystemExit("ASPM login Service is unreachable") from error
                  time.sleep(2)
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        readOnlyRootFilesystem: true
      resources:
        requests: {cpu: 50m, memory: 128Mi}
        limits: {cpu: 500m, memory: 256Mi}

