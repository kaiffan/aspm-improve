---
# Source: aspm/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aspm-aspm
  labels:
    app.kubernetes.io/name: aspm
    app.kubernetes.io/instance: aspm
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: "aspm-0.1.0-rc.7"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aspm
      app.kubernetes.io/instance: aspm
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "aspm-lab-ingress"
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: aspm-lab-traefik-aspm-lab-ingress
      ports: [{protocol: TCP, port: 8080}]
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: aspm
              app.kubernetes.io/instance: aspm
              app.kubernetes.io/component: test
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - ports:
      - port: 5432
        protocol: TCP
      - port: 6379
        protocol: TCP
      to:
      - podSelector:
          matchExpressions:
          - key: aspm-lab-service
            operator: In
            values:
            - postgres
            - broker
            - cache
