# Configure reviewed scanner images (prefer immutable digests) in SEMGREP_IMAGE/TRIVY_IMAGE vars.
name: Deliver scanner evidence to ASPM
on: workflow_dispatch
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - key: semgrep
            scanner: Semgrep JSON Report
            file: semgrep.json
          - key: trivy
            scanner: Trivy Scan
            file: trivy.json
    steps:
      - uses: actions/checkout@v4
      - name: Scan checked-out commit
        env:
          SCANNER: ${{ matrix.key }}
          SEMGREP_IMAGE: ${{ vars.SEMGREP_IMAGE }}
          TRIVY_IMAGE: ${{ vars.TRIVY_IMAGE }}
        run: |
          set -eu
          case "$SCANNER" in
            semgrep)
              : "${SEMGREP_IMAGE:?Configure a reviewed scanner image}"
              docker run --rm -v "$PWD:/src" "$SEMGREP_IMAGE" semgrep scan --config auto --json --output /src/semgrep.json /src
              ;;
            trivy)
              : "${TRIVY_IMAGE:?Configure a reviewed scanner image}"
              docker run --rm -v "$PWD:/src" "$TRIVY_IMAGE" fs --format json --output /src/trivy.json /src
              ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: scan-reports-${{ matrix.key }}
          path: ${{ matrix.file }}
      - name: Upload scanner report (results publish automatically)
        env:
          ASPM_URL: ${{ vars.ASPM_URL }}
          ASPM_PROJECT_ID: ${{ vars.ASPM_PROJECT_ID }}
          ASPM_TOKEN: ${{ secrets.ASPM_TOKEN }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          PIPELINE_ID: github/${{ github.repository_id }}/${{ github.run_id }}
          JOB_ID: ${{ github.job }}/${{ matrix.key }}
          ATTEMPT_NUMBER: ${{ github.run_attempt }}
          SCAN_SCOPE: repository-rules-v1
          DELIVERY_KEY: github/${{ github.repository_id }}/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.key }}
          SCANNER_TYPE: ${{ matrix.scanner }}
          REPORT_FILE: ${{ matrix.file }}
        run: sh examples/aspm-ci/upload.sh > delivery-${{ matrix.key }}.json
