# Configure reviewed SEMGREP_IMAGE/TRIVY_IMAGE/CURL_IMAGE/PYTHON_IMAGE,
# protected/masked ASPM_TOKEN (submit,status) and ASPM_REPORT_TOKEN (status,read,finalize,reports),
# and non-secret ASPM_URL / ASPM_PROJECT_ID. Scanner images should use immutable digests.
stages: [scan, deliver, report]
semgrep:
  stage: scan
  image:
    name: $SEMGREP_IMAGE
    entrypoint: [""]
  script:
    - semgrep scan --config auto --json --output semgrep.json .
  artifacts:
    paths: [semgrep.json]
trivy:
  stage: scan
  image:
    name: $TRIVY_IMAGE
    entrypoint: [""]
  script:
    - trivy fs --format json --output trivy.json .
  artifacts:
    paths: [trivy.json]
.aspm_delivery:
  stage: deliver
  image:
    name: $CURL_IMAGE
    entrypoint: [""]
  variables:
    COMMIT_SHA: $CI_COMMIT_SHA
    REPOSITORY_URL: $CI_PROJECT_URL
  script:
    # A retry of this script keeps its key; GitLab job retry gets a new CI_JOB_ID.
    - export DELIVERY_KEY="gitlab/${CI_PROJECT_ID}/${CI_PIPELINE_ID}/${CI_JOB_ID}"
    - sh examples/aspm-ci/upload.sh > "delivery-${CI_JOB_NAME}.json"
  artifacts:
    paths: [delivery-*.json]
deliver_semgrep:
  extends: .aspm_delivery
  needs: [{job: semgrep, artifacts: true}]
  variables:
    SCANNER_TYPE: Semgrep JSON Report
    REPORT_FILE: semgrep.json
deliver_trivy:
  extends: .aspm_delivery
  needs: [{job: trivy, artifacts: true}]
  variables:
    SCANNER_TYPE: Trivy Scan
    REPORT_FILE: trivy.json
aspm_report:
  stage: report
  image:
    name: $PYTHON_IMAGE
    entrypoint: [""]
  when: always
  needs:
    - {job: deliver_semgrep, artifacts: true}
    - {job: deliver_trivy, artifacts: true}
  script:
    - ASPM_TOKEN="$ASPM_REPORT_TOKEN" python examples/aspm-ci/finalize.py delivery-*.json
  artifacts:
    when: always
    paths: [aspm-generated/]
# ASPM_TOKEN for this job requires read,finalize,reports plus status, and the same service user.
# A missing expected scanner produces an explicitly incomplete generated report and a failing job.
