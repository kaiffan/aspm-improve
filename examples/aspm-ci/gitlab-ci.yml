# Configure reviewed SEMGREP_IMAGE/TRIVY_IMAGE/CURL_IMAGE/PYTHON_IMAGE,
# protected/masked ASPM_TOKEN (submit,status),
# and non-secret ASPM_URL / ASPM_PROJECT_ID. Scanner images should use immutable digests.
stages: [scan, deliver]
semgrep:
  stage: scan
  image:
    name: $SEMGREP_IMAGE
    entrypoint: [""]
  script:
    - semgrep scan --config auto --json --output semgrep.json .
  artifacts:
    paths: [semgrep.json]
trivy:
  stage: scan
  image:
    name: $TRIVY_IMAGE
    entrypoint: [""]
  script:
    - trivy fs --format json --output trivy.json .
  artifacts:
    paths: [trivy.json]
.aspm_delivery:
  stage: deliver
  image:
    name: $CURL_IMAGE
    entrypoint: [""]
  variables:
    COMMIT_SHA: $CI_COMMIT_SHA
    REPOSITORY_URL: $CI_PROJECT_URL
    PIPELINE_ID: gitlab/$CI_PROJECT_ID/$CI_PIPELINE_ID
    JOB_ID: $CI_JOB_NAME
    SCAN_SCOPE: repository-rules-v1
  script:
    # A retry of this script keeps its key; GitLab job retry gets a new CI_JOB_ID.
    - export DELIVERY_KEY="gitlab/${CI_PROJECT_ID}/${CI_PIPELINE_ID}/${CI_JOB_ID}"
    - sh examples/aspm-ci/upload.sh > "delivery-${CI_JOB_NAME}.json"
  artifacts:
    paths: [delivery-*.json]
deliver_semgrep:
  extends: .aspm_delivery
  needs: [{job: semgrep, artifacts: true}]
  variables:
    SCANNER_TYPE: Semgrep JSON Report
    REPORT_FILE: semgrep.json
deliver_trivy:
  extends: .aspm_delivery
  needs: [{job: trivy, artifacts: true}]
  variables:
    SCANNER_TYPE: Trivy Scan
    REPORT_FILE: trivy.json
