worker_processes 1;
pid /var/run/defectdojo/nginx.pid;
events { worker_connections 1024; }
http { include /etc/nginx/mime.types; default_type application/octet-stream; client_max_body_size 30m;
 gzip on; gzip_types application/javascript text/css image/svg+xml; gzip_min_length 1000;
 server { listen 8080; location /static/ { alias /usr/share/nginx/html/static/; } location / { include /etc/nginx/wsgi_params; uwsgi_pass aspm:3031; uwsgi_read_timeout 120; } }
}
